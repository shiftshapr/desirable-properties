<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-label="Desirable Properties to Requirements to ADRs to Build Overweb">
  <defs>
    <style>
      .chip { fill: #0b1220; stroke: #334155; stroke-width: 2; }
      .chip-active { fill: #082f3a; stroke: #22d3ee; stroke-width: 2; }
      .label { fill: #cbd5e1; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 21px; font-weight: 600; text-anchor: middle; }
      .label-active { fill: #a5f3fc; }
      .step { fill: #64748b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-anchor: middle; }
      .step-active { fill: #22d3ee; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
      .arrow-head { fill: #475569; }
      .note { fill: #22d3ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="960" height="210" rx="16" fill="#020617" />

  <text x="140" y="46" class="step step-active">STEP 1</text>
  <rect x="20" y="60" width="240" height="72" rx="12" class="chip-active" />
  <text x="140" y="103" class="label label-active">Desirable Properties</text>
  <text x="140" y="164" class="note">You are here</text>

  <path d="M270 96 H292" class="arrow" />
  <path d="M300 96 l-10 -6 v12 z" class="arrow-head" />

  <text x="400" y="46" class="step">STEP 2</text>
  <rect x="300" y="60" width="200" height="72" rx="12" class="chip" />
  <text x="400" y="103" class="label">Requirements</text>

  <path d="M510 96 H532" class="arrow" />
  <path d="M540 96 l-10 -6 v12 z" class="arrow-head" />

  <text x="610" y="46" class="step">STEP 3</text>
  <rect x="540" y="60" width="140" height="72" rx="12" class="chip" />
  <text x="610" y="103" class="label">ADRs</text>

  <path d="M690 96 H712" class="arrow" />
  <path d="M720 96 l-10 -6 v12 z" class="arrow-head" />

  <text x="830" y="46" class="step">STEP 4</text>
  <rect x="720" y="60" width="220" height="72" rx="12" class="chip" />
  <text x="830" y="103" class="label">Build Overweb</text>
</svg>
