# desirableproperties.org — Next.js on port 3005
# sudo cp /home/ubuntu/nginx/desirableproperties.org.conf /etc/nginx/sites-available/
# sudo ln -sf /etc/nginx/sites-available/desirableproperties.org.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# TLS (first time): sudo certbot --nginx -d desirableproperties.org -d www.desirableproperties.org

server {
    server_name desirableproperties.org www.desirableproperties.org;

    # Broadcast image uploads (large originals, optimized server-side).
    client_max_body_size 30m;

    # Canonical host — Web3Auth allowlist uses apex domain.
    if ($host = www.desirableproperties.org) {
        return 301 https://desirableproperties.org$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # ----------------------------------------------------------------
    # Desirable Properties book — cover (/book) and reader (/viewer/*)
    # Served as static files from /var/www/desirableproperties-book/
    # (mirrors the metaweb-book pattern on metawebbook.com).
    # ----------------------------------------------------------------

    # Book route: redirect to the book subdomain (which has /book/ serving the cover)
    location = /book {
        return 302 https://book.desirableproperties.org/;
    }
    location = /book/ {
        return 302 https://book.desirableproperties.org/;
    }
    location /book/ {
        return 302 https://book.desirableproperties.org/;
    }

    # Reader SPA — /viewer/intro (or any /viewer/<chapter>) → viewer.htm
    # Using prefix match (^~) so this is selected over the location / proxy_pass below
    # without depending on regex-location ordering.
    location ^~ /viewer {
        add_header Cache-Control "no-cache";
        root /var/www/desirableproperties-book;
        try_files $uri /viewer.htm;
    }

    # Book manifest + JSON data — short cache.
    location /json/ {
        add_header Cache-Control "public, max-age=300";
        root /var/www/desirableproperties-book;
        try_files $uri =404;
    }

    # Book static assets — long cache (paths are fingerprinted).
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        root /var/www/desirableproperties-book;
        try_files $uri =404;
    }

    # Ordinals content proxy (for viewer inscription rails / DP ordinal refs).
    location /content/ {
        proxy_pass https://ordinals.com/content/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }
    location /r/ {
        proxy_pass https://ordinals.com/r/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }
    location /inscription/ {
        proxy_pass https://ordinals.com/inscription/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }

    # Kickoff meeting audio (~12MB, gitignored under public/media/).
    # Served here so range requests do not go through the Next.js process.
    location ^~ /media/ {
        alias /home/ubuntu/desirable-properties/challenge-site/public/media/;
        add_header Cache-Control "public, max-age=86400";
        types { audio/mpeg mp3; }
    }

    # Fingerprinted Next.js assets live on disk under .next-prod/static/.
    # Serve them here so CSS/JS keep working during `pm2 restart` and
    # in-place builds (Next.js otherwise returns 500 text/plain, 21B).
    location /_next/static/ {
        alias /home/ubuntu/desirable-properties/challenge-site/.next-prod/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/desirableproperties.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/desirableproperties.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.desirableproperties.org) {
        return 301 https://desirableproperties.org$request_uri;
    } # managed by Certbot

    if ($host = desirableproperties.org) {
        return 301 https://desirableproperties.org$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name desirableproperties.org www.desirableproperties.org;
    return 404; # managed by Certbot
}
