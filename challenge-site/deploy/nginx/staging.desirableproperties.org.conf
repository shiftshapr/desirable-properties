# staging.desirableproperties.org — challenge-site Next.js on port 3006
# sudo cp /home/ubuntu/desirable-properties/challenge-site/deploy/nginx/staging.desirableproperties.org.conf /etc/nginx/sites-available/
# sudo ln -sf /etc/nginx/sites-available/staging.desirableproperties.org.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.desirableproperties.org;

    client_max_body_size 30m;

    ssl_certificate /etc/letsencrypt/live/staging.desirableproperties.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.desirableproperties.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location /_next/static/ {
        alias /home/ubuntu/desirable-properties/challenge-site/.next-staging/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name staging.desirableproperties.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
