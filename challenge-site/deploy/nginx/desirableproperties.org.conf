# desirableproperties.org — Next.js on port 3005
# sudo cp /home/ubuntu/desirable-properties/challenge-site/deploy/nginx/desirableproperties.org.conf /etc/nginx/sites-available/
# sudo ln -sf /etc/nginx/sites-available/desirableproperties.org.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    server_name desirableproperties.org www.desirableproperties.org;

    client_max_body_size 30m;

    if ($host = www.desirableproperties.org) {
        return 301 https://desirableproperties.org$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location = /book {
        return 302 https://book.desirableproperties.org/;
    }
    location = /book/ {
        return 302 https://book.desirableproperties.org/;
    }
    location /book/ {
        return 302 https://book.desirableproperties.org/;
    }

    location ^~ /viewer {
        add_header Cache-Control "no-cache";
        root /var/www/desirableproperties-book;
        try_files $uri /viewer.htm;
    }

    location /json/ {
        add_header Cache-Control "public, max-age=300";
        root /var/www/desirableproperties-book;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        root /var/www/desirableproperties-book;
        try_files $uri =404;
    }

    location /content/ {
        proxy_pass https://ordinals.com/content/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }
    location /r/ {
        proxy_pass https://ordinals.com/r/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }
    location /inscription/ {
        proxy_pass https://ordinals.com/inscription/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }

    location ^~ /media/ {
        alias /home/ubuntu/desirable-properties/challenge-site/public/media/;
        add_header Cache-Control "public, max-age=86400";
        types { audio/mpeg mp3; }
    }

    location /_next/static/ {
        alias /home/ubuntu/desirable-properties/challenge-site/.next-prod/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        # Web3Auth login sets an encrypted hermes_session cookie that includes the
        # idToken; default nginx proxy buffers are too small and return 502.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/desirableproperties.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desirableproperties.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.desirableproperties.org) {
        return 301 https://desirableproperties.org$request_uri;
    }

    if ($host = desirableproperties.org) {
        return 301 https://desirableproperties.org$request_uri;
    }

    listen 80;
    listen [::]:80;
    listen 216.238.91.120:80;
    server_name desirableproperties.org www.desirableproperties.org;
    return 404;
}
