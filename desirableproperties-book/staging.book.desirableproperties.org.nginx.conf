# staging.book.desirableproperties.org – DP book reader (staging static tree)
#
# Bootstrap: HTTP only. After install, run: sudo certbot --nginx -d staging.book.desirableproperties.org
# Or: bash scripts/enable-staging-book-nginx.sh
#
# DNS: A staging.book.desirableproperties.org → 216.238.91.120 (Cloudflare orange-cloud is OK once nginx is live)

server {
    listen 80;
    listen [::]:80;
    server_name staging.book.desirableproperties.org;

    root /home/ubuntu/desirableproperties-book-staging;
    index index.html viewer.htm;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Ordinals content proxy (same paths as prod book vhost).
    location /content/local/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /content/ {
        proxy_pass https://ordinals.com/content/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }
    location /r/ {
        proxy_pass https://ordinals.com/r/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }
    location /inscription/ {
        proxy_pass https://ordinals.com/inscription/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordinals.com;
    }

    location /json/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /assets/dp-canopi-bridge.js {
        add_header Cache-Control "no-cache";
    }

    location = /             { try_files /index.html =404; }
    location = /book         { return 302 /; }
    location = /book/        { try_files /index.html =404; }
    location /book/          { try_files $uri $uri/ /index.html =404; }
    location = /preview.html { return 302 /; }

    location ~ ^/viewer(/.*)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /viewer.htm;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Certbot --nginx adds listen 443 ssl server { ... } and may add HTTP→HTTPS redirect.
