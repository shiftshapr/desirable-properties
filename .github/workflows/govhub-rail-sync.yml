name: Gov Hub rail sync

# Pull approved Gov Hub revisions into content/local/dp*.md (see docs/GOVHUB-RAIL-SYNC.md).

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      env:
        description: Gov Hub environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - main
      dry_run:
        description: Preview changes without writing or committing
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [govhub-rail-sync]

concurrency:
  group: govhub-rail-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve sync environment
        id: cfg
        env:
          INPUT_ENV: ${{ inputs.env }}
          DISPATCH_ENV: ${{ github.event.client_payload.env }}
        run: |
          env_name="dev"
          if [ -n "${INPUT_ENV}" ]; then
            env_name="${INPUT_ENV}"
          elif [ -n "${DISPATCH_ENV}" ]; then
            env_name="${DISPATCH_ENV}"
          fi
          echo "env=${env_name}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ inputs.dry_run && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Sync rails from Gov Hub
        id: sync
        run: |
          set -euo pipefail
          args=(--env "${{ steps.cfg.outputs.env }}")
          if [ "${{ steps.cfg.outputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/govhub_sync_rails_from_hub.py "${args[@]}"

      - name: Commit and push rail updates
        if: steps.cfg.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          rails='desirableproperties-book/content/local/dp*.md'
          shopt -s nullglob
          files=($rails)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No rail files found; nothing to commit."
            exit 0
          fi

          git add "${files[@]}"
          if git diff --staged --quiet; then
            echo "Rails already up to date with Gov Hub."
            exit 0
          fi

          env_label="${{ steps.cfg.outputs.env }}"
          git commit -m "sync: pull DP rails from Gov Hub ${env_label} [rail-sync]"
          git push
