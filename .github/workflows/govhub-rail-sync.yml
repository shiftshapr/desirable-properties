name: Gov Hub rail sync

# Pull approved Gov Hub revisions into content/local/dp*.md (see docs/GOVHUB-RAIL-SYNC.md).

on:
  schedule:
    # Daily fallback if Gov Hub dispatch webhook missed (06:00 UTC)
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      env:
        description: Gov Hub environment
        required: false
        default: main
        type: choice
        options:
          - dev
          - main
      dry_run:
        description: Preview changes without writing or committing
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [govhub-rail-sync]

concurrency:
  group: govhub-rail-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      rails_changed: ${{ steps.commit.outputs.rails_changed }}
      dry_run: ${{ steps.cfg.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve sync environment
        id: cfg
        env:
          INPUT_ENV: ${{ inputs.env }}
          DISPATCH_ENV: ${{ github.event.client_payload.env }}
        run: |
          env_name="main"
          if [ -n "${INPUT_ENV}" ]; then
            env_name="${INPUT_ENV}"
          elif [ -n "${DISPATCH_ENV}" ]; then
            env_name="${DISPATCH_ENV}"
          fi
          echo "env=${env_name}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ inputs.dry_run && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Sync rails from Gov Hub
        id: sync
        run: |
          set -euo pipefail
          args=(--env "${{ steps.cfg.outputs.env }}")
          if [ "${{ steps.cfg.outputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/govhub_sync_rails_from_hub.py "${args[@]}"

      - name: Commit and push rail updates
        id: commit
        if: steps.cfg.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          rails=(
            desirableproperties-book/content/local/dp*.md
            desirableproperties-book/content/local/about.md
            desirableproperties-book/content/local/acknowledgements.md
          )
          asset_dir="desirableproperties-book/content/local/assets/dp"
          shopt -s nullglob
          files=("${rails[@]}")
          if [ -d "${asset_dir}" ]; then
            while IFS= read -r asset; do
              files+=("${asset}")
            done < <(find "${asset_dir}" -type f ! -name '.gitkeep' 2>/dev/null || true)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No rail files found; nothing to commit."
            echo "rails_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "${files[@]}"
          if git diff --staged --quiet; then
            echo "Rails already up to date with Gov Hub."
            echo "rails_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          env_label="${{ steps.cfg.outputs.env }}"
          git commit -m "sync: pull book rails from Gov Hub ${env_label} [rail-sync]"
          git push
          echo "rails_changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.rails_changed == 'true' && needs.sync.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy book to VPS (staging then production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            REPO="/home/ubuntu/desirable-properties"
            cd "$REPO"
            # Always deploy from origin/main (VPS may be on a feature branch from manual work).
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main

            bash desirableproperties-book/scripts/deploy-staging-book.sh
            bash desirableproperties-book/deploy.sh
