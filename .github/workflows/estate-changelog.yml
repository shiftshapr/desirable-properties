name: Estate changelog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require changelog when site files change
        run: node scripts/check-changelog.mjs
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGELOG_FILE: changelog.json
          CHANGELOG_WATCH: challenge-site/src/,challenge-site/app/,challenge-site/public/,challenge-site/pages/
