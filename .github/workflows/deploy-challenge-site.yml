name: Deploy Challenge Site

on:
  push:
    branches: [ main ]
    paths:
      - 'challenge-site/**'
      - '.github/workflows/deploy-challenge-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: challenge-site/package-lock.json

    - name: Install dependencies
      run: |
        cd challenge-site
        npm ci

    - name: Build application
      run: |
        cd challenge-site
        npm run build
      env:
        NODE_ENV: production
        DP_ENV: prod

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          REPO="/home/ubuntu/desirable-properties"
          APP_DIR="${REPO}/challenge-site"

          cd "$REPO"
          git pull origin main

          # npm ci must run as the SSH user — root-owned node_modules causes EACCES
          if [[ -e "${APP_DIR}/node_modules" ]] && [[ "$(stat -c '%U' "${APP_DIR}/node_modules")" != "${USER}" ]]; then
            if sudo -n chown -R "${USER}:${USER}" "$APP_DIR" 2>/dev/null; then
              echo "Fixed ownership under ${APP_DIR}"
            else
              echo "ERROR: ${APP_DIR}/node_modules is not owned by ${USER}; run: sudo chown -R ${USER}:${USER} ${APP_DIR}" >&2
              exit 1
            fi
          fi

          cd "$APP_DIR"
          npm ci
          DP_ENV=prod npm run build
          test -f .next-prod/BUILD_ID

          # Only restart PM2 after a successful build (keep serving on build failure)
          pm2 delete desirableproperties 2>/dev/null || true
          pm2 start ecosystem.config.js

          # `pm2 save` persists only what is online. Deploying while some other
          # app happens to be down would delete that app from ~/.pm2/dump.pm2,
          # so it would not survive the next reboot. The guard refuses unless
          # every app in meta-console/registry.yaml is online and serving.
          # A refusal must never be worked around with a bare `pm2 save`.
          if ! /home/ubuntu/meta-console/bin/pm2-safe-save --wait 60; then
            echo "::warning::pm2 boot dump not updated - another app is unhealthy."
            echo "Deploy succeeded and the site is serving; ~/.pm2/dump.pm2 still"
            echo "holds the previous state. Fix the app(s), then run"
            echo "/home/ubuntu/meta-console/bin/pm2-safe-save on the box."
          fi
