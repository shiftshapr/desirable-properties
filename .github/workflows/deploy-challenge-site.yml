name: Deploy Challenge Site

on:
  push:
    branches: [ main ]
    paths:
      - 'challenge-site/**'
      - '.github/workflows/deploy-challenge-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: challenge-site/package-lock.json

    - name: Install dependencies
      run: |
        cd challenge-site
        npm ci

    - name: Build application
      run: |
        cd challenge-site
        npm run build
      env:
        NODE_ENV: production
        DP_ENV: prod

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          REPO="/home/ubuntu/desirable-properties"
          APP_DIR="${REPO}/challenge-site"

          cd "$REPO"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          # npm ci must run as the SSH user — root-owned node_modules causes EACCES
          if [[ -e "${APP_DIR}/node_modules" ]] && [[ "$(stat -c '%U' "${APP_DIR}/node_modules")" != "${USER}" ]]; then
            if sudo -n chown -R "${USER}:${USER}" "$APP_DIR" 2>/dev/null; then
              echo "Fixed ownership under ${APP_DIR}"
            else
              echo "ERROR: ${APP_DIR}/node_modules is not owned by ${USER}; run: sudo chown -R ${USER}:${USER} ${APP_DIR}" >&2
              exit 1
            fi
          fi

          cd "$APP_DIR"
          npm ci
          # Atomic swap via deploy.sh — do not `DP_ENV=prod npm run build` here.
          # In-place writes to .next-prod while PM2 is serving it return
          # HTTP 500 text/plain (21B) for /_next/static CSS.
          ./deploy.sh
